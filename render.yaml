# Render blueprint: one Node web service serves the client and the /ws game socket.
services:
  - type: web
    name: eldermoor
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      # Optional Postgres connection string so heroes survive deploys (see docs/persistence.md).
      # Set the value in the Render dashboard; it is never stored in this repo.
      - key: DATABASE_URL
        sync: false
